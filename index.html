<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazda of Seattle — Vehicle Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --p0: #0a0a0a;
  --p1: #111111;
  --p2: #1a1a1a;
  --p3: #252525;
  --p4: #333333;
  --p5: #666666;
  --p6: #999999;
  --p7: #cccccc;
  --red: #c8102e;
  --red-dim: #8b0b1f;
  --white: #ffffff;
  --gold: #b8955a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--p0);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── HEADER ── */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  height: 72px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.site-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--white);
  text-decoration: none;
}

.site-logo span { color: var(--red); }

.header-nav {
  display: flex;
  gap: 32px;
  list-style: none;
}

.header-nav a {
  color: var(--p6);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: color 0.2s;
}

.header-nav a:hover { color: var(--white); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding-top: 72px;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 70% 50%, rgba(200,16,46,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 20% 80%, rgba(200,16,46,0.04) 0%, transparent 60%),
    var(--p0);
}

.hero-content {
  position: relative;
  text-align: center;
  padding: 0 24px;
}

.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 20px;
}

.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(56px, 10vw, 120px);
  line-height: 0.9;
  letter-spacing: 4px;
  margin-bottom: 28px;
}

.hero-title .line2 {
  color: var(--p5);
  font-size: 0.6em;
  letter-spacing: 8px;
  display: block;
}

.hero-subtitle {
  font-size: 14px;
  color: var(--p6);
  max-width: 400px;
  margin: 0 auto 48px;
  letter-spacing: 0.5px;
}

.scroll-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--p5);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: bounce 2s ease-in-out infinite;
}

.scroll-hint::after {
  content: '';
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--p5), transparent);
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* ── LOADING STATE ── */
.loading-screen {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 80px 24px;
}

.loader {
  width: 36px;
  height: 36px;
  border: 2px solid var(--p3);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--p5);
}

/* ── MODEL NAV ── */
.model-nav-wrap {
  position: sticky;
  top: 72px;
  z-index: 90;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.model-nav {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 48px;
}

.model-nav::-webkit-scrollbar { display: none; }

.model-tab {
  flex-shrink: 0;
  padding: 18px 28px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--p5);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.model-tab:hover { color: var(--p7); }
.model-tab.active { color: var(--white); border-bottom-color: var(--red); }

/* ── MODEL SECTION ── */
.models-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 48px;
}

.model-section {
  padding: 80px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display: none;
}

.model-section.active { display: block; }

/* ── VEHICLE STAGE ── */
.vehicle-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
  margin-bottom: 80px;
}

.stage-left {}

.model-year-badge {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 12px;
}

.model-name-large {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(42px, 6vw, 72px);
  letter-spacing: 3px;
  line-height: 0.95;
  margin-bottom: 32px;
}

/* ── COLOR SWITCHER ── */
.color-switcher {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  overflow: hidden;
}

.color-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.color-tab-btn {
  flex: 1;
  padding: 12px;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--p5);
  background: none;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}

.color-tab-btn.active {
  color: var(--white);
  background: rgba(255,255,255,0.04);
}

.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px;
}

.color-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.2s;
}

.color-swatch:hover,
.color-swatch.active { opacity: 1; }

.swatch-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.color-swatch.active .swatch-circle {
  border-color: var(--white);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
}

.swatch-label {
  font-size: 9px;
  letter-spacing: 0.5px;
  color: var(--p6);
  text-align: center;
  max-width: 60px;
  line-height: 1.2;
}

/* Interior photo panel */
.interior-panel {
  display: none;
  padding: 16px;
}

.interior-panel.active { display: block; }
.exterior-panel.hidden { display: none; }

.interior-thumbs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.interior-thumb {
  aspect-ratio: 4/3;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}

.interior-thumb.active { border-color: var(--red); }

.interior-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.85);
  transition: filter 0.2s;
}

.interior-thumb:hover img,
.interior-thumb.active img { filter: brightness(1); }

/* ── CAR IMAGE ── */
.stage-right {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 340px;
}

.car-glow {
  position: absolute;
  width: 70%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(200,16,46,0.12) 0%, transparent 70%);
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  filter: blur(40px);
}

.car-image-wrap {
  position: relative;
  width: 100%;
  text-align: center;
  transition: opacity 0.35s ease;
}

.car-image-wrap.fading { opacity: 0; }

.car-img {
  max-width: 100%;
  max-height: 320px;
  object-fit: contain;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.8));
  transition: transform 0.6s ease;
}

.car-img:hover { transform: scale(1.02) translateY(-4px); }

.no-image-placeholder {
  width: 100%;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--p4);
  border-radius: 8px;
  color: var(--p5);
  font-size: 12px;
  letter-spacing: 1px;
}

/* Interior full view */
.interior-main-image {
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
  display: none;
}

.interior-main-image.active { display: block; }
.interior-main-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── TRIM SELECTOR ── */
.trim-section { margin-bottom: 60px; }

.section-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 20px;
}

.trim-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.trim-tab {
  padding: 10px 20px;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  color: var(--p5);
  cursor: pointer;
  transition: all 0.2s;
}

.trim-tab:hover {
  color: var(--white);
  border-color: rgba(255,255,255,0.2);
}

.trim-tab.active {
  color: var(--white);
  background: var(--p3);
  border-color: var(--red);
}

/* ── TRIM STATS ── */
.trim-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 48px;
}

.stat-cell {
  background: var(--p1);
  padding: 24px 20px;
  text-align: center;
}

.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  color: var(--white);
  line-height: 1;
  margin-bottom: 4px;
}

.stat-unit {
  font-size: 12px;
  color: var(--red);
  letter-spacing: 1px;
}

.stat-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--p5);
  margin-top: 4px;
}

/* ── FEATURES ── */
.features-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-bottom: 48px;
}

.feature-category {}

.category-title {
  font-size: 10px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.feature-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.feature-item {
  font-size: 13px;
  color: var(--p7);
  padding-left: 14px;
  position: relative;
  line-height: 1.4;
}

.feature-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--red);
}

/* ── PACKAGES ── */
.packages-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 48px;
}

.package-card {
  flex: 1;
  min-width: 200px;
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 20px;
}

.package-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 1.5px;
  color: var(--white);
  margin-bottom: 12px;
}

.package-feature {
  font-size: 12px;
  color: var(--p6);
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.package-feature:last-child { border-bottom: none; }

/* ── TRIM COMPARE ── */
.compare-section { margin-top: 60px; }

.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.compare-table th {
  padding: 14px 16px;
  text-align: left;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1.5px;
  color: var(--white);
  background: var(--p2);
  border-bottom: 2px solid var(--red);
}

.compare-table th:first-child {
  color: var(--p5);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}

.compare-table td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--p7);
  vertical-align: top;
}

.compare-table tr:hover td { background: rgba(255,255,255,0.02); }

.compare-table td:first-child {
  color: var(--p5);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

.check { color: #4ade80; font-size: 14px; }
.dash  { color: var(--p4); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 120px 24px;
  color: var(--p5);
}

.empty-state h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 3px;
  margin-bottom: 12px;
  color: var(--p4);
}

/* ── FOOTER ── */
.site-footer {
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 48px;
  text-align: center;
  color: var(--p5);
  font-size: 12px;
  letter-spacing: 1px;
}

.footer-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--p4);
  margin-bottom: 8px;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .site-header { padding: 0 24px; }
  .models-container { padding: 0 24px; }
  .model-nav { padding: 0 24px; }
  .vehicle-stage { grid-template-columns: 1fr; gap: 40px; }
  .stage-right { order: -1; }
  .trim-stats { grid-template-columns: repeat(2, 1fr); }
  .features-grid { grid-template-columns: 1fr; }
  .header-nav { display: none; }
}

@media (max-width: 600px) {
  .trim-stats { grid-template-columns: repeat(2, 1fr); }
  .compare-table { font-size: 11px; }
  .compare-table th, .compare-table td { padding: 10px 10px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a class="site-logo" href="#">Mazda <span>Seattle</span></a>
  <nav>
    <ul class="header-nav">
      <li><a href="#">Models</a></li>
      <li><a href="https://mazdaofseattle.com" target="_blank">Visit Dealership</a></li>
    </ul>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">Mazda of Seattle</p>
    <h1 class="hero-title">
      Explore<br>
      <span class="line2">Our Lineup</span>
    </h1>
    <p class="hero-subtitle">Every model. Every trim. Every feature. One place.</p>
    <div class="scroll-hint">Scroll</div>
  </div>
</section>

<!-- MAIN CONTENT -->
<main id="main-content">
  <div class="loading-screen" id="loading">
    <div class="loader"></div>
    <p class="loading-text">Loading vehicles</p>
  </div>
  <div id="vehicles-root" style="display:none;"></div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-logo">Mazda of Seattle</div>
  <p>Vehicle information subject to change. Contact us for current availability and details.</p>
</footer>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const SUPABASE_URL  = 'https://dvznpeelgyebzdublamt.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2em5wZWVsZ3llYnpkdWJsYW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjEyMjIsImV4cCI6MjA5MzU5NzIyMn0.x4AXUr4PcGkxZUR19T0FhNth1Lo8PsIaeUJxLQiqK9o';

const headers = {
  'apikey': SUPABASE_ANON,
  'Authorization': `Bearer ${SUPABASE_ANON}`,
  'Content-Type': 'application/json'
};

async function sbFetch(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!r.ok) throw new Error(`Supabase error: ${r.status}`);
  return r.json();
}

// ─────────────────────────────────────────────
// DATA LOAD
// ─────────────────────────────────────────────
async function loadAll() {
  const [models, trims, colors, features, packages] = await Promise.all([
    sbFetch('models?select=*&published=eq.true&order=sort_order.asc'),
    sbFetch('trims?select=*'),
    sbFetch('colors?select=*'),
    sbFetch('features?select=*&order=sort_order.asc'),
    sbFetch('packages?select=*'),
  ]);

  // Index by model_id / trim_id
  const trimsByModel = {};
  trims.forEach(t => {
    (trimsByModel[t.model_id] = trimsByModel[t.model_id] || []).push(t);
  });

  const colorsByModel = {};
  colors.forEach(c => {
    (colorsByModel[c.model_id] = colorsByModel[c.model_id] || []).push(c);
  });

  const featuresByTrim = {};
  features.forEach(f => {
    (featuresByTrim[f.trim_id] = featuresByTrim[f.trim_id] || []).push(f);
  });

  const packagesByTrim = {};
  packages.forEach(p => {
    (packagesByTrim[p.trim_id] = packagesByTrim[p.trim_id] || []).push(p);
  });

  return { models, trimsByModel, colorsByModel, featuresByTrim, packagesByTrim };
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render(data) {
  const { models, trimsByModel, colorsByModel, featuresByTrim, packagesByTrim } = data;
  const root = document.getElementById('vehicles-root');

  if (!models.length) {
    root.innerHTML = `
      <div class="empty-state">
        <h2>No Vehicles Published Yet</h2>
        <p>Check back soon — inventory is being added.</p>
      </div>`;
    root.style.display = 'block';
    return;
  }

  // ── Model Nav ──
  const navHtml = `
    <div class="model-nav-wrap">
      <div class="model-nav" id="model-nav">
        ${models.map((m, i) =>
          `<button class="model-tab${i===0?' active':''}" data-model="${m.id}" onclick="switchModel('${m.id}')">${m.name}</button>`
        ).join('')}
      </div>
    </div>
    <div class="models-container" id="models-container"></div>`;

  root.innerHTML = navHtml;

  // ── Render each model section ──
  const container = document.getElementById('models-container');

  models.forEach((model, mi) => {
    const trims      = trimsByModel[model.id] || [];
    const modelColors = colorsByModel[model.id] || [];
    const extColors  = modelColors.filter(c => c.type === 'exterior');
    const intColors  = modelColors.filter(c => c.type === 'interior');

    const section = document.createElement('div');
    section.className = `model-section${mi === 0 ? ' active' : ''}`;
    section.id = `model-${model.id}`;

    // Default first trim
    const firstTrim = trims[0] || {};
    const firstFeatures = firstTrim.id ? featuresByTrim[firstTrim.id] || [] : [];
    const firstPackages = firstTrim.id ? packagesByTrim[firstTrim.id] || [] : [];

    section.innerHTML = `
      ${buildStage(model, extColors, intColors)}
      ${buildTrimSection(model, trims, firstTrim, firstFeatures, firstPackages)}
      ${trims.length > 1 ? buildCompare(trims, featuresByTrim) : ''}
    `;

    container.appendChild(section);

    // Wire up trim tabs
    section.querySelectorAll('.trim-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const trimId = btn.dataset.trim;
        const trim   = trims.find(t => t.id == trimId);
        if (!trim) return;
        // Update active tab
        section.querySelectorAll('.trim-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Re-render stats + features + packages
        section.querySelector('.trim-details').innerHTML =
          buildTrimDetails(trim, featuresByTrim[trim.id] || [], packagesByTrim[trim.id] || []);
      });
    });

    // Wire up color switcher
    wireColorSwitcher(section, model.id, extColors, intColors);
  });

  root.style.display = 'block';
}

// ── Vehicle Stage (image + color switcher) ──
function buildStage(model, extColors, intColors) {
  const firstExt = extColors[0];
  const firstImg = firstExt?.image_url || '';
  const firstInt = intColors[0];
  const firstIntImg = firstInt?.image_url || '';

  return `
    <div class="vehicle-stage">
      <div class="stage-left">
        <p class="model-year-badge">${model.year || ''}</p>
        <h2 class="model-name-large">${model.name}</h2>

        <div class="color-switcher" id="switcher-${model.id}">
          <div class="color-tabs">
            <button class="color-tab-btn active" data-tab="exterior" onclick="switchColorTab(this,'${model.id}')">Exterior</button>
            <button class="color-tab-btn" data-tab="interior" onclick="switchColorTab(this,'${model.id}')">Interior</button>
          </div>

          <div class="exterior-panel" id="ext-panel-${model.id}">
            <div class="color-swatches">
              ${extColors.map((c, i) => `
                <div class="color-swatch${i===0?' active':''}" data-color-id="${c.id}" data-img="${c.image_url||''}" data-model="${model.id}" onclick="switchColor(this,'${model.id}')">
                  <div class="swatch-circle" style="background:${c.hex_code||'#555'};"></div>
                  <span class="swatch-label">${c.name}</span>
                </div>
              `).join('')}
              ${extColors.length === 0 ? '<p style="font-size:12px;color:var(--p5);padding:8px;">No colors uploaded yet.</p>' : ''}
            </div>
          </div>

          <div class="interior-panel" id="int-panel-${model.id}" style="display:none;">
            <div class="interior-thumbs">
              ${intColors.map((c, i) => `
                <div class="interior-thumb${i===0?' active':''}" data-img="${c.image_url||''}" data-model="${model.id}" onclick="switchInteriorThumb(this,'${model.id}')">
                  ${c.image_url ? `<img src="${c.image_url}" alt="${c.name}" loading="lazy">` : `<div style="background:var(--p3);width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--p5);">${c.name}</div>`}
                </div>
              `).join('')}
              ${intColors.length === 0 ? '<p style="font-size:12px;color:var(--p5);padding:8px;">No interior photos uploaded yet.</p>' : ''}
            </div>
          </div>
        </div>
      </div>

      <div class="stage-right">
        <div class="car-glow"></div>
        <div class="car-image-wrap" id="car-img-${model.id}">
          ${firstImg
            ? `<img class="car-img" src="${firstImg}" alt="${model.name}" id="car-img-el-${model.id}" loading="lazy">`
            : `<div class="no-image-placeholder">Image Coming Soon</div>`}
        </div>
        <div class="interior-main-image" id="int-main-${model.id}">
          ${firstIntImg ? `<img src="${firstIntImg}" alt="Interior" id="int-main-el-${model.id}" loading="lazy">` : ''}
        </div>
      </div>
    </div>`;
}

// ── Trim Section ──
function buildTrimSection(model, trims, activeTrim, features, packages) {
  if (!trims.length) return '<p style="color:var(--p5);font-size:13px;">No trims available yet.</p>';

  return `
    <div class="trim-section">
      <p class="section-label">Select Trim</p>
      <div class="trim-tabs">
        ${trims.map((t, i) =>
          `<button class="trim-tab${i===0?' active':''}" data-trim="${t.id}">${t.name}</button>`
        ).join('')}
      </div>
      <div class="trim-details">
        ${buildTrimDetails(activeTrim, features, packages)}
      </div>
    </div>`;
}

function buildTrimDetails(trim, features, packages) {
  const cats = {};
  features.forEach(f => {
    (cats[f.category] = cats[f.category] || []).push(f);
  });

  const statsHtml = `
    <div class="trim-stats">
      <div class="stat-cell">
        <div class="stat-value">${trim.mpg_city || '—'}</div>
        <div class="stat-unit">MPG</div>
        <div class="stat-label">City</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value">${trim.mpg_hwy || '—'}</div>
        <div class="stat-unit">MPG</div>
        <div class="stat-label">Highway</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value">${trim.horsepower || '—'}</div>
        <div class="stat-unit">HP</div>
        <div class="stat-label">Horsepower</div>
      </div>
      <div class="stat-cell">
        <div class="stat-value">${trim.towing_capacity ? trim.towing_capacity.toLocaleString() : '—'}</div>
        <div class="stat-unit">${trim.towing_capacity ? 'LBS' : ''}</div>
        <div class="stat-label">Towing</div>
      </div>
    </div>`;

  const metaHtml = `
    <div style="display:flex;gap:24px;margin-bottom:32px;flex-wrap:wrap;">
      ${trim.engine ? `<div><span style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--p5);">Engine</span><br><span style="font-size:14px;color:var(--p7);">${trim.engine}</span></div>` : ''}
      ${trim.transmission ? `<div><span style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--p5);">Transmission</span><br><span style="font-size:14px;color:var(--p7);">${trim.transmission}</span></div>` : ''}
      ${trim.drivetrain ? `<div><span style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--p5);">Drivetrain</span><br><span style="font-size:14px;color:var(--p7);">${trim.drivetrain}</span></div>` : ''}
    </div>`;

  const featCats = Object.keys(cats);
  const featHtml = featCats.length ? `
    <p class="section-label" style="margin-bottom:20px;">Features</p>
    <div class="features-grid">
      ${featCats.map(cat => `
        <div class="feature-category">
          <div class="category-title">${cat}</div>
          <ul class="feature-list">
            ${cats[cat].map(f => `<li class="feature-item">${f.feature_text}</li>`).join('')}
          </ul>
        </div>
      `).join('')}
    </div>` : '';

  const pkgHtml = packages.length ? `
    <p class="section-label" style="margin-bottom:16px;">Available Packages</p>
    <div class="packages-row">
      ${packages.map(pkg => {
        const items = Array.isArray(pkg.package_features) ? pkg.package_features : (pkg.package_features || []);
        return `
          <div class="package-card">
            <div class="package-name">${pkg.name}</div>
            ${items.map(f => `<div class="package-feature">${f}</div>`).join('')}
          </div>`;
      }).join('')}
    </div>` : '';

  return statsHtml + metaHtml + featHtml + pkgHtml;
}

// ── Trim Compare Table ──
function buildCompare(trims, featuresByTrim) {
  const rows = [
    { label: 'Engine',       key: 'engine' },
    { label: 'Transmission', key: 'transmission' },
    { label: 'Drivetrain',   key: 'drivetrain' },
    { label: 'Horsepower',   key: 'horsepower' },
    { label: 'MPG City',     key: 'mpg_city' },
    { label: 'MPG Hwy',      key: 'mpg_hwy' },
    { label: 'Towing',       key: 'towing_capacity' },
  ];

  return `
    <div class="compare-section">
      <p class="section-label" style="margin-bottom:20px;">Trim Comparison</p>
      <div style="overflow-x:auto;">
        <table class="compare-table">
          <thead>
            <tr>
              <th>Spec</th>
              ${trims.map(t => `<th>${t.name}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${row.label}</td>
                ${trims.map(t => {
                  const val = t[row.key];
                  return `<td>${val !== null && val !== undefined && val !== '' ? val : '<span class="dash">—</span>'}</td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
// INTERACTION HANDLERS
// ─────────────────────────────────────────────
function switchModel(modelId) {
  document.querySelectorAll('.model-tab').forEach(t => t.classList.toggle('active', t.dataset.model == modelId));
  document.querySelectorAll('.model-section').forEach(s => s.classList.toggle('active', s.id === `model-${modelId}`));
  // Scroll to model nav
  document.querySelector('.model-nav-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function switchColorTab(btn, modelId) {
  const tab = btn.dataset.tab;
  // Update buttons
  btn.closest('.color-tabs').querySelectorAll('.color-tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const extPanel  = document.getElementById(`ext-panel-${modelId}`);
  const intPanel  = document.getElementById(`int-panel-${modelId}`);
  const carImg    = document.getElementById(`car-img-${modelId}`);
  const intMain   = document.getElementById(`int-main-${modelId}`);

  if (tab === 'exterior') {
    extPanel.style.display = 'block';
    intPanel.style.display = 'none';
    carImg.style.display   = 'block';
    intMain.classList.remove('active');
  } else {
    extPanel.style.display = 'none';
    intPanel.style.display = 'block';
    carImg.style.display   = 'none';
    intMain.classList.add('active');
    // Show first interior image
    const firstThumb = document.querySelector(`#int-panel-${modelId} .interior-thumb`);
    if (firstThumb) switchInteriorThumb(firstThumb, modelId);
  }
}

function switchColor(swatch, modelId) {
  // Update active state
  document.querySelectorAll(`[data-model="${modelId}"].color-swatch`).forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');

  const imgUrl = swatch.dataset.img;
  const wrap   = document.getElementById(`car-img-${modelId}`);
  const imgEl  = document.getElementById(`car-img-el-${modelId}`);

  if (!imgUrl) return;

  if (imgEl) {
    wrap.classList.add('fading');
    setTimeout(() => {
      imgEl.src = imgUrl;
      imgEl.onload = () => wrap.classList.remove('fading');
    }, 175);
  } else {
    // First image being set
    wrap.innerHTML = `<img class="car-img" src="${imgUrl}" alt="Vehicle" id="car-img-el-${modelId}" loading="lazy">`;
  }
}

function switchInteriorThumb(thumb, modelId) {
  document.querySelectorAll(`#int-panel-${modelId} .interior-thumb`).forEach(t => t.classList.remove('active'));
  thumb.classList.add('active');

  const imgUrl = thumb.dataset.img;
  const mainEl = document.getElementById(`int-main-${modelId}`);
  if (!imgUrl || !mainEl) return;

  mainEl.innerHTML = `<img src="${imgUrl}" alt="Interior" style="width:100%;border-radius:8px;" loading="lazy">`;
}
