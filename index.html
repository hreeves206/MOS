<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazda of Seattle — Vehicle Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --p0: #0a0a0a;
  --p1: #111111;
  --p2: #1a1a1a;
  --p3: #252525;
  --p4: #333333;
  --p5: #666666;
  --p6: #999999;
  --p7: #cccccc;
  --red: #c8102e;
  --red-dim: #8b0b1f;
  --white: #ffffff;
  --gold: #b8955a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--p0);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(200,16,46,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 85% 55%, rgba(200,16,46,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 15% 95%, rgba(200,16,46,0.08) 0%, transparent 55%);
  background-attachment: fixed;
}

/* ── HEADER ── */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  height: 72px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.site-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--white);
  text-decoration: none;
}

.site-logo span { color: var(--red); }

.header-nav {
  display: flex;
  gap: 32px;
  list-style: none;
}

.header-nav a {
  color: var(--p6);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transition: color 0.2s;
}

.header-nav a:hover { color: var(--white); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding-top: 72px;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 70% 50%, rgba(200,16,46,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 20% 80%, rgba(200,16,46,0.04) 0%, transparent 60%),
    var(--p0);
}

.hero-content {
  position: relative;
  text-align: center;
  padding: 0 24px;
}

.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 20px;
}

.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(56px, 10vw, 120px);
  line-height: 0.9;
  letter-spacing: 4px;
  margin-bottom: 28px;
}

.hero-title .line2 {
  color: var(--p5);
  font-size: 0.6em;
  letter-spacing: 8px;
  display: block;
}

.hero-subtitle {
  font-size: 14px;
  color: var(--p6);
  max-width: 400px;
  margin: 0 auto 48px;
  letter-spacing: 0.5px;
}

.scroll-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--p5);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: bounce 2s ease-in-out infinite;
}

.scroll-hint::after {
  content: '';
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--p5), transparent);
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}

/* ── LOADING STATE ── */
.loading-screen {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 80px 24px;
}

.loader {
  width: 36px;
  height: 36px;
  border: 2px solid var(--p3);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--p5);
}

/* ── MODEL NAV ── */
.model-nav-wrap {
  position: sticky;
  top: 72px;
  z-index: 90;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.model-nav {
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 48px;
}

.model-nav::-webkit-scrollbar { display: none; }

.model-tab {
  flex-shrink: 0;
  padding: 18px 28px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--p5);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.model-tab:hover { color: var(--p7); }
.model-tab.active { color: var(--white); border-bottom-color: var(--red); }

/* ── MODEL SECTION ── */
.models-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 40px;
}

.model-section {
  padding: 80px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display: none;
}

.model-section.active { display: block; }

/* ── VEHICLE STAGE ── */
.vehicle-stage {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
  margin-bottom: 60px;
}

.stage-left {}

.model-year-badge {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 12px;
}

.model-name-large {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(42px, 6vw, 72px);
  letter-spacing: 3px;
  line-height: 0.95;
  margin-bottom: 32px;
}

/* ── COLOR SWITCHER ── */
.color-switcher {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  overflow: hidden;
}

.color-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.color-tab-btn {
  flex: 1;
  padding: 12px;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--p5);
  background: none;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}

.color-tab-btn.active {
  color: var(--white);
  background: rgba(255,255,255,0.04);
}

.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px;
}

.color-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.2s;
}

.color-swatch:hover,
.color-swatch.active { opacity: 1; }

.swatch-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid transparent;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}

.color-swatch:hover .swatch-circle {
  transform: scale(1.1);
}

.color-swatch.active .swatch-circle {
  border-color: var(--white);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
  transform: scale(1.1);
}

.swatch-label {
  font-size: 9px;
  letter-spacing: 0.5px;
  color: var(--p6);
  text-align: center;
  max-width: 60px;
  line-height: 1.2;
}

/* Interior photo panel */
.interior-panel {
  display: none;
  padding: 16px;
}

.interior-panel.active { display: block; }
.exterior-panel.hidden { display: none; }

.interior-thumbs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.interior-thumb {
  aspect-ratio: 4/3;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}

.interior-thumb.active { border-color: var(--red); }

.interior-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.85);
  transition: filter 0.2s;
}

.interior-thumb:hover img,
.interior-thumb.active img { filter: brightness(1); }

/* ── CAR IMAGE ── */
.stage-right {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 340px;
}

.car-glow {
  position: absolute;
  width: 70%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(200,16,46,0.12) 0%, transparent 70%);
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  filter: blur(40px);
}

.car-image-wrap {
  position: relative;
  width: 100%;
  text-align: center;
  transition: opacity 0.35s ease;
}

.car-image-wrap.fading { opacity: 0; }

.car-img {
  max-width: 100%;
  max-height: 320px;
  object-fit: contain;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.8));
  transition: transform 0.6s ease;
}

.car-img:hover { transform: scale(1.02) translateY(-4px); }

.no-image-placeholder {
  width: 100%;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--p4);
  border-radius: 8px;
  color: var(--p5);
  font-size: 12px;
  letter-spacing: 1px;
}

/* Interior full view */
.interior-main-image {
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
  display: none;
}

.interior-main-image.active { display: block; }
.interior-main-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── TRIM SELECTOR ── */
.trim-section { margin-bottom: 60px; }

.section-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 20px;
  display: block;
}

.trim-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 24px;
  align-items: start;
}

.trim-tabs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 140px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  scrollbar-width: none;
}

.trim-tab {
  padding: 18px 16px;
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  color: var(--p5);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  width: 100%;
}

.trim-tab:hover {
  color: var(--white);
  border-color: rgba(255,255,255,0.2);
  background: var(--p3);
}

.trim-tab.active {
  color: var(--white);
  background: var(--p3);
  border-color: var(--red);
  border-left-width: 3px;
}

.trim-tab-name {
  display: block;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px;
  letter-spacing: 1.5px;
}

@media (max-width: 768px) {
  .trim-layout {
    grid-template-columns: 1fr;
  }
  .trim-tabs {
    flex-direction: row;
    flex-wrap: wrap;
    position: static;
  }
  .trim-tab {
    flex: 1;
    min-width: 140px;
  }
}

/* ── TRIM STATS ── */
.trim-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 36px;
}

.stat-cell {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 24px 16px;
  text-align: center;
}

.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 1px;
  color: var(--white);
  line-height: 1;
  margin-bottom: 6px;
}

.stat-unit {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--p5);
}

/* ── TRIM META ── */
.trim-meta {
  display: flex;
  gap: 0;
  margin-bottom: 40px;
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  overflow: hidden;
}

.trim-meta-item {
  flex: 1;
  padding: 16px 20px;
  border-right: 1px solid rgba(255,255,255,0.06);
}

.trim-meta-item:last-child { border-right: none; }

.trim-meta-label {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--p5);
  margin-bottom: 6px;
}

.trim-meta-val {
  font-size: 14px;
  color: var(--p7);
}

/* ── FEATURES ── */
.features-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 16px;
  margin-bottom: 48px;
}

.feature-category-card {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 20px;
}

.category-title {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

.feature-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.feature-item {
  font-size: 14px;
  color: var(--white);
  padding-left: 12px;
  position: relative;
  line-height: 1.5;
}

.feature-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--red);
}

.feat-expand-btn {
  background: none;
  border: none;
  color: var(--red);
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  padding: 8px 0 2px 12px;
  text-transform: uppercase;
  transition: opacity 0.2s;
}
.feat-expand-btn:hover { opacity: 0.7; }
.feat-expanded .feature-item { display: list-item; }

/* ── PACKAGES ── */
.packages-row {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  align-items: flex-start;
  margin-bottom: 0;
}

.packages-centered { justify-content: center; }

.package-card {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-top: 3px solid var(--red);
  border-radius: 10px;
  padding: 24px;
  flex: 0 1 300px;
  min-width: 220px;
}

.package-card-large {
  padding: 28px;
}

.package-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--white);
  margin-bottom: 4px;
}

.package-feature-count {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 16px;
}

.package-feature {
  font-size: 13px;
  color: var(--white);
  padding: 7px 0 7px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: relative;
  line-height: 1.4;
}

.package-feature::before {
  content: '';
  position: absolute;
  left: 0; top: 14px;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--red);
}

.package-feature:last-child { border-bottom: none; }

/* ── PACKAGES SECTION ── */
.packages-section {
  margin-bottom: 60px;
  padding: 48px;
  background: rgba(255,255,255,0.02);
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
}

/* ── TRIM COMPARE ── */
.compare-section { margin-top: 60px; }

.compare-wrap {
  background: var(--p2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  overflow: hidden;
}

.compare-specs-row {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.compare-specs-row:last-child { border-bottom: none; }

.compare-spec-label {
  flex: 0 0 180px;
  padding: 14px 20px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--white);
  background: rgba(255,255,255,0.02);
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
}

.compare-trim-name {
  flex: 1;
  padding: 14px 20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1.5px;
  color: var(--white);
  border-right: 1px solid rgba(255,255,255,0.05);
}

.compare-trim-name:last-child { border-right: none; }

.compare-spec-val {
  flex: 1;
  padding: 13px 20px;
  font-size: 13px;
  color: var(--p7);
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
}

.compare-spec-val:last-child { border-right: none; }

.compare-diff-header .compare-spec-label {
  background: var(--p3);
  color: var(--gold);
  font-size: 10px;
}

.compare-diff-header .compare-trim-name {
  background: var(--p3);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: var(--p6);
}

.check { color: #4ade80; font-size: 16px; }
.dash  { color: var(--p4); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 120px 24px;
  color: var(--p5);
}

.empty-state h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 3px;
  margin-bottom: 12px;
  color: var(--p4);
}

/* ── FOOTER ── */
.site-footer {
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 48px;
  text-align: center;
  color: var(--p5);
  font-size: 12px;
  letter-spacing: 1px;
}

.footer-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--p4);
  margin-bottom: 8px;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .site-header { padding: 0 24px; }
  .models-container { padding: 0 24px; }
  .model-nav { padding: 0 24px; }
  .vehicle-stage { grid-template-columns: 1fr; gap: 40px; }
  .stage-right { order: -1; }
  .trim-stats { grid-template-columns: repeat(2, 1fr); }
  .features-grid { grid-template-columns: 1fr; }
  .header-nav { display: none; }
}

@media (max-width: 600px) {
  .trim-stats { grid-template-columns: repeat(2, 1fr); }
  .compare-table { font-size: 11px; }
  .compare-table th, .compare-table td { padding: 10px 10px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <a class="site-logo" href="#">Mazda <span>Seattle</span></a>
  <nav>
    <ul class="header-nav">
      <li><a href="#">Models</a></li>
      <li><a href="https://mazdaofseattle.com" target="_blank">Visit Dealership</a></li>
    </ul>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">Mazda of Seattle</p>
    <h1 class="hero-title">
      Explore<br>
      <span class="line2">Our Lineup</span>
    </h1>
    <p class="hero-subtitle">Every model. Every trim. Every feature. One place.</p>
    <div class="scroll-hint">Scroll</div>
  </div>
</section>

<!-- MAIN CONTENT -->
<main id="main-content">
  <div class="loading-screen" id="loading">
    <div class="loader"></div>
    <p class="loading-text">Loading vehicles</p>
  </div>
  <div id="vehicles-root" style="display:none;"></div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-logo">Mazda of Seattle</div>
  <p>Vehicle information subject to change. Contact us for current availability and details.</p>
</footer>

<script>
// ─────────────────────────────────────────────
// MAZDA COLOR LOOKUP TABLE
// ─────────────────────────────────────────────
const MAZDA_COLORS = {
  // Reds
  'soul red crystal metallic': '#9B1B1E', 'soul red metallic': '#9B1B1E',
  'zeal red metallic': '#B01C20', 'artisan red premium metallic': '#6B1518',
  'red': '#9B1B1E',
  // Blues
  'deep crystal blue mica': '#1B3D6B', 'eternal blue mica': '#1B2E50',

function getMazdaColorHex(colorName) {
  if (!colorName) return '#4A4A4A';
  const key = colorName.toLowerCase().trim();
  if (MAZDA_COLORS[key]) return MAZDA_COLORS[key];
  // Check if any known key appears anywhere in the color name
  for (const [k, v] of Object.entries(MAZDA_COLORS)) {
    if (key.includes(k)) return v;
  }
  // Check individual meaningful words
  const words = key.split(/\s+/);
  for (const word of words) {
    if (word.length > 3 && MAZDA_COLORS[word]) return MAZDA_COLORS[word];
  }
  return '#4A4A4A';
}

function render(data) {

  const root = document.getElementById('vehicles-root');

  if (!models.length) {
    root.innerHTML = `
      <div class="empty-state">
        <h2>No Vehicles Published Yet</h2>
        <p>Check back soon — inventory is being added.</p>
      </div>`;
    root.style.display = 'block';
    return;
  }

  // ── Model Nav ──
  const navHtml = `
    <div class="model-nav-wrap">
      <div class="model-nav" id="model-nav">
        ${models.map((m, i) =>
          `<button class="model-tab${i===0?' active':''}" data-model="${m.id}" onclick="switchModel('${m.id}')">${m.name}</button>`
        ).join('')}
      </div>
    </div>
    <div class="models-container" id="models-container"></div>`;

  root.innerHTML = navHtml;

  // ── Render each model section ──
  const container = document.getElementById('models-container');

  models.forEach((model, mi) => {
    const trims      = trimsByModel[model.id] || [];
    const modelColors = colorsByModel[model.id] || [];
    const extColors  = modelColors.filter(c => c.type === 'exterior');
    const intColors  = modelColors.filter(c => c.type === 'interior');

    const section = document.createElement('div');
    section.className = `model-section${mi === 0 ? ' active' : ''}`;
    section.id = `model-${model.id}`;

    // Default first trim
    const firstTrim = trims[0] || {};
    const firstFeatures = firstTrim.id ? featuresByTrim[firstTrim.id] || [] : [];

    // Collect ALL packages across all trims for this model
    const allModelPackages = trims.flatMap(t => packagesByTrim[t.id] || []);

    section.innerHTML = `
      ${buildStage(model, extColors, intColors)}
      ${allModelPackages.length ? buildPackagesSection(allModelPackages) : ''}
      ${buildTrimSection(model, trims, firstTrim, firstFeatures)}
      ${trims.length > 1 ? buildCompareSection(model.id, trims) : ''}
    `;

    container.appendChild(section);

    // Wire up trim tabs
    section.querySelectorAll('.trim-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const trimId = btn.dataset.trim;
        const trim   = trims.find(t => t.id == trimId);
        if (!trim) return;
        section.querySelectorAll('.trim-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Show only this trim's specific features
        section.querySelector('.trim-details').innerHTML =
          buildTrimDetails(trim, featuresByTrim[trim.id] || []);
      });
    });

    // Wire up color switcher
    wireColorSwitcher(section, model.id, extColors, intColors);
  });

  root.style.display = 'block';

  // Load comparisons for all models with multiple trims
  data.models.forEach(model => {
    const trims = data.trimsByModel[model.id] || [];
    if (trims.length > 1) loadComparison(model.id, trims);
  });
}

// ── Helpers ──
function toTitleCase(str) {
  return String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}
function cleanHp(val) {
  if (!val) return null;
  const n = parseInt(String(val).replace(/[^0-9]/g, ''));
  return isNaN(n) ? null : n;
}
function cleanTowing(val) {
  if (!val) return null;
  const n = parseInt(String(val).replace(/[^0-9]/g, ''));
  return isNaN(n) ? null : n;
}

// ── Cumulative features: merge all features from level 1 up to this trim's level ──
function getCumulativeFeatures(trims, featuresByTrim, upToLevel) {
  const seen = new Set();
  const result = [];
  // Get all trims at or below this level, sorted ascending
  const relevantTrims = trims
    .filter(t => (parseInt(t.level) || 1) <= (parseInt(upToLevel) || 1))
    .sort((a, b) => (parseInt(a.level)||1) - (parseInt(b.level)||1));
  relevantTrims.forEach(t => {
    (featuresByTrim[t.id] || []).forEach(f => {
      // Deduplicate by normalized text
      const key = f.feature_text.toLowerCase().trim();
      if (!seen.has(key)) {
        seen.add(key);
        result.push(f);
      }
    });
  });
  return result;
}

// Fixed category display order
const CAT_ORDER = ['Safety & Security', 'Interior', 'Exterior', 'Engine & Mechanical'];

function normalizeCat(cat) {
  const c = (cat||'').toLowerCase();
  if (c.includes('safety') || c.includes('security')) return 'Safety & Security';
  if (c.includes('interior')) return 'Interior';
  if (c.includes('exterior')) return 'Exterior';
  if (c.includes('engine') || c.includes('mechanical') || c.includes('powertrain')) return 'Engine & Mechanical';
  return cat;
}

function buildTrimDetails(trim, features) {
  const cats = {};
  features.forEach(f => {
    const cat = normalizeCat(f.category || 'General');
    (cats[cat] = cats[cat] || []).push(f);
  });

  const hp = cleanHp(trim.horsepower);
  const tow = cleanTowing(trim.towing_capacity);

  const statsHtml = ''; // Stats shown in comparison table only

  const metaHtml = ''; // Engine/transmission/drivetrain shown in comparison table

  // Ordered categories — always same order regardless of which trim
  const orderedCats = [
    ...CAT_ORDER.filter(c => cats[c]),
    ...Object.keys(cats).filter(c => !CAT_ORDER.includes(c))
  ];

  const PREVIEW_COUNT = 4;
  const featHtml = orderedCats.length ? `
    <p class="section-label" style="margin-bottom:20px;">Standard Features</p>
    <div class="features-grid">
      ${orderedCats.map(cat => {
        const items = cats[cat];
        const preview = items.slice(0, PREVIEW_COUNT);
        const rest = items.slice(PREVIEW_COUNT);
        const catId = 'feat-'+Math.random().toString(36).slice(2,8);
        return `
        <div class="feature-category-card">
          <div class="category-title">${toTitleCase(cat)}</div>
          <ul class="feature-list">
            ${preview.map(f => `<li class="feature-item">${toTitleCase(f.feature_text)}</li>`).join('')}
            ${rest.length ? `
              <div class="feat-expanded" id="${catId}" style="display:none;">
                ${rest.map(f => `<li class="feature-item">${toTitleCase(f.feature_text)}</li>`).join('')}
              </div>
              <button class="feat-expand-btn" onclick="toggleFeats('${catId}',this)">
                Show ${rest.length} more ▾
              </button>` : ''}
          </ul>
        </div>`;
      }).join('')}
    </div>` : '';

  return statsHtml + metaHtml + featHtml;
}

async function loadComparison(modelId, trims) {

  if (!inner) return;
  try {
    const rows = await sbFetch('model_comparisons?model_id=eq.'+modelId+'&select=*&order=generated_at.desc&limit=1');

// ── Old compare kept for fallback ──
function fuzzyKey(str) {
  // Normalize feature text for fuzzy grouping — strips punctuation, numbers, extra words
  return str.toLowerCase()
    .replace(/[^a-z ]/g, '')
    .replace(/\b(with|and|or|the|a|an|w|s)\b/g, '')
    .replace(/\s+/g, ' ').trim()
    .split(' ').sort().join(' ');
}

function buildCompare(trims, featuresByTrim) {
  // Group features by fuzzy key so "Blind Spot Monitoring" and "Blind Spot Monitoring System" match
  const groups = {}; // fuzzyKey -> { canonical text, trimSet }
  trims.forEach(t => {
    (featuresByTrim[t.id] || []).forEach(f => {
      const key = fuzzyKey(f.feature_text);
      if (!groups[key]) groups[key] = { text: f.feature_text, trimSet: new Set() };
      groups[key].trimSet.add(t.id);
    });
  });
  // Differentiators: present in some but not all trims
  const differentiators = Object.values(groups)
    .filter(g => g.trimSet.size < trims.length)
    .sort((a, b) => b.trimSet.size - a.trimSet.size)
    .slice(0, 16);

  const specsHtml = `
    <div class="compare-specs-row">
      <div class="compare-spec-label"></div>
      ${trims.map(t => `<div class="compare-trim-name">${toTitleCase(t.name)}</div>`).join('')}
    </div>
    ${[
      {label:'MPG City', vals: trims.map(t => t.mpg_city || '—')},
      {label:'MPG Highway', vals: trims.map(t => t.mpg_hwy || '—')},
      {label:'Horsepower', vals: trims.map(t => cleanHp(t.horsepower) || '—')},
      {label:'Towing', vals: trims.map(t => { const v=cleanTowing(t.towing_capacity); return v ? v.toLocaleString()+' lbs' : '—'; })},
      {label:'Drivetrain', vals: trims.map(t => toTitleCase(t.drivetrain||'—'))},
    ].map(row => `
      <div class="compare-specs-row">
        <div class="compare-spec-label">${row.label}</div>
        ${row.vals.map(v => `<div class="compare-spec-val">${v}</div>`).join('')}
      </div>`).join('')}`;

  const diffHtml = differentiators.length ? `
    <div style="margin-top:8px;">
      <div class="compare-specs-row compare-diff-header">
        <div class="compare-spec-label">What You Get</div>
        ${trims.map(t => `<div class="compare-trim-name">${toTitleCase(t.name)}</div>`).join('')}
      </div>
      ${differentiators.map(g => `
        <div class="compare-specs-row">
          <div class="compare-spec-label">${toTitleCase(g.text)}</div>
          ${trims.map(t => `<div class="compare-spec-val">${g.trimSet.has(t.id) ? '<span class="check">✓</span>' : '<span class="dash">—</span>'}</div>`).join('')}
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="compare-section">
      <p class="section-label" style="margin-bottom:20px;">Trim Comparison</p>
      <div class="compare-wrap">
        ${specsHtml}
        ${diffHtml}
      </div>
    </div>`;
}

function toggleFeats(id, btn) {
  const el = document.getElementById(id);

  const expanded = el.style.display !== 'none';
  el.style.display = expanded ? 'none' : 'block';
  const count = el.querySelectorAll('.feature-item').length;
  btn.textContent = expanded ? `Show ${count} more ▾` : 'Show less ▴';
}

function switchModel(modelId) {
  document.querySelectorAll('.model-tab').forEach(t => t.classList.toggle('active', t.dataset.model == modelId));
  document.querySelectorAll('.model-section').forEach(s => s.classList.toggle('active', s.id === `model-${modelId}`));
  // Scroll to model nav
  document.querySelector('.model-nav-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function switchColorTab(btn, modelId) {
  const tab = btn.dataset.tab;
  // Update buttons
  btn.closest('.color-tabs').querySelectorAll('.color-tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const extPanel  = document.getElementById(`ext-panel-${modelId}`);
  const intPanel  = document.getElementById(`int-panel-${modelId}`);
  const carImg    = document.getElementById(`car-img-${modelId}`);
  const intMain   = document.getElementById(`int-main-${modelId}`);

  if (tab === 'exterior') {
    extPanel.style.display = 'block';
    intPanel.style.display = 'none';
    carImg.style.display   = 'block';
    intMain.classList.remove('active');
  } else {
    extPanel.style.display = 'none';
    intPanel.style.display = 'block';
    carImg.style.display   = 'none';
    intMain.classList.add('active');
    // Show first interior image
    const firstThumb = document.querySelector(`#int-panel-${modelId} .interior-thumb`);
    if (firstThumb) switchInteriorThumb(firstThumb, modelId);
  }
}

  const wrap   = document.getElementById(`car-img-${modelId}`);
  const imgEl  = document.getElementById(`car-img-el-${modelId}`);

  if (!imgUrl) return;

  if (imgEl) {
    wrap.classList.add('fading');
    setTimeout(() => {
      imgEl.src = imgUrl;
      imgEl.onload = () => wrap.classList.remove('fading');
    }, 175);
  } else {
    // First image being set
    wrap.innerHTML = `<img class="car-img" src="${imgUrl}" alt="Vehicle" id="car-img-el-${modelId}" loading="lazy">`;
  }
}

function switchInteriorThumb(thumb, modelId) {
  document.querySelectorAll(`#int-panel-${modelId} .interior-thumb`).forEach(t => t.classList.remove('active'));
  thumb.classList.add('active');

  const imgUrl = thumb.dataset.img;
  const mainEl = document.getElementById(`int-main-${modelId}`);
  if (!imgUrl || !mainEl) return;

  mainEl.innerHTML = `<img src="${imgUrl}" alt="Interior" style="width:100%;border-radius:8px;" loading="lazy">`;
}
